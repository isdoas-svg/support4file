<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>보내기 목록</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 40px 20px; 
      text-align: center; 
      background-color: #f8f9fa;
    }
    .container {
      display: inline-block;
      width: 100%;
      max-width: 450px;
    }
    .menu-card { 
      padding: 30px; 
      border: 1px solid #e0e0e0; 
      border-radius: 12px; 
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 25px;
      color: #333;
    }
    .btn { 
      display: block; 
      margin: 18px 0; 
      padding: 14px 20px; 
      color: white; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: bold;
      transition: opacity 0.2s;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover { opacity: 0.85; }
    
    /* 버튼별 색상 */
    .btn-blue { background-color: #007bff; }
    .btn-green { background-color: #28a745; }
    .btn-dark { background-color: #495057; } /* 나의 요청 내역 버튼 */
  </style>
</head>
<body>

  <div class="container">
    <div class="menu-card">
      <h2>📄 서류 종류 선택</h2>
      
      <!-- 1. 결제 서류 -->
      <a class="btn btn-blue" onclick="openAndLog('결제 서류', '서류 요청 - 스쿨메일.html')">결제 서류</a>
      
      <!-- 2. 검사 자료 -->
      <a class="btn btn-green" onclick="openAndLog('검사 자료', '검사 자료 - 스쿨메일(파일 묶음).html')">검사 자료</a>
      
      <!-- 3. 바로 아래 배치된 나의 요청 내역 -->
      <a class="btn btn-dark" href="./history.html">나의 요청 내역</a>
    </div>
  </div>

  <script>
    function openAndLog(reportName, url) {
      const detailMemo = prompt(`[${reportName}] 요청 내용을 입력해주세요.\n(예: 8월분 결제, OO고등학교 검사지 등)`, "");
      if (detailMemo === null) return;

      const now = new Date().toLocaleString('ko-KR', { 
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' 
      });

      let history = JSON.parse(localStorage.getItem('my_request_history') || '[]');

      history.unshift({
        time: now,
        type: reportName,
        memo: detailMemo.trim() === "" ? "(내용 없음)" : detailMemo
      });

      if (history.length > 50) history.pop();
      localStorage.setItem('my_request_history', JSON.stringify(history));

      window.open(url, '_blank');
    }
  </script>
</body>
</html>
