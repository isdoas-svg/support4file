<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>보내기 목록</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 40px 20px; 
      text-align: center; 
      background-color: #f8f9fa;
    }
    .container {
      display: inline-block;
      width: 100%;
      max-width: 400px;
    }
    .menu-card { 
      padding: 30px; 
      border: 1px solid #e0e0e0; 
      border-radius: 12px; 
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 25px;
      color: #333;
    }
    .btn { 
      display: block; 
      width: 100%;
      margin: 16px 0; 
      padding: 14px 20px; 
      color: white; 
      border-radius: 6px; 
      font-weight: bold;
      transition: opacity 0.2s;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover { opacity: 0.85; }
    
    .btn-blue { background-color: #007bff; }
    .btn-green { background-color: #28a745; }
    .btn-dark { background-color: #495057; }
  </style>
</head>
<body>

  <div class="container">
    <div class="menu-card">
      <h2>📄 서류 종류 선택</h2>
      
      <!-- 1. 결제 서류 (현재 창 이동) -->
      <a class="btn btn-blue" href="웹등록 결제 서류 - 스쿨메일.html">결제 서류</a>
      
      <!-- 2. 검사 자료 (현재 창 이동) -->
      <a class="btn btn-green" href="웹등록 검사 자료 - 스쿨메일(파일 묶음).html">검사 자료</a>
      
      <!-- 3. 나의 요청 내역 (현재 창 이동) -->
      <a class="btn btn-dark" href="history.html">나의 요청 내역</a>
    </div>
  </div>

</body>
</html>
