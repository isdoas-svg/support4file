<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>리포트 선택 목록</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 40px; 
      text-align: center; 
      background-color: #f8f9fa;
    }
    .menu-card { 
      display: inline-block; 
      padding: 30px; 
      border: 1px solid #e0e0e0; 
      border-radius: 12px; 
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      min-width: 280px;
    }
    h2 {
      margin-bottom: 25px;
      color: #333;
    }
    /* 공통 버튼 스타일 */
    .btn { 
      display: block; 
      margin: 18px 0; /* 간격을 기존 10px에서 18px로 넓혔습니다 */
      padding: 12px 20px; 
      color: white; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.85; /* 마우스 올렸을 때 살짝 흐려지는 효과 */
    }

    /* 첫 번째 버튼 색상 (파란색 계열) */
    .btn-blue { 
      background-color: #007bff; 
    }
    
    /* 두 번째 버튼 색상 (녹색 계열) */
    .btn-green { 
      background-color: #28a745; 
    }
  </style>
</head>
<body>
  <div class="menu-card">
    <h2>📄 서류 종류 선택</h2>
    
    <!-- 버튼별로 다른 색상 클래스(btn-blue, btn-green) 적용 -->
    <a class="btn btn-blue" href="서류 요청 - 스쿨메일.html" target="_blank">결제 서류</a>
    <a class="btn btn-green" href="검사 자료 - 스쿨메일(파일 묶음).html" target="_blank">검사 자료</a>
  </div>
</body>
</html>
